<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="records.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema">☀️ Claro</button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <form id="name-form" class="hidden" autocomplete="off">
          <label for="name-input">¡Nuevo record! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" value="Jugador" />
            <button id="name-save" type="submit">Guardar</button>
          </div>
        </form>
        <div id="overlay-records-box" class="records-box hidden">
          <span class="label">TOP 5</span>
          <ol id="overlay-records" class="records-list"></ol>
          <p id="overlay-stats" class="records-stats"></p>
          <button id="overlay-reset-btn" class="link-btn" type="button">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="start-screen" class="start-screen hidden">
    <div class="start-box">
      <h2>RECORDS</h2>
      <ol id="start-records" class="records-list"></ol>
      <p class="records-stats">Mejor combo: <b id="start-best-combo">0</b> · Líneas máximas: <b id="start-max-lines">0</b></p>
      <button id="play-btn" type="button">Jugar</button>
      <button id="start-reset-btn" class="link-btn" type="button">Resetear records</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="records.js"></script>
</body>
</html>
